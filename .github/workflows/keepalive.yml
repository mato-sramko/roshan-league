# GitHub turns off scheduled workflows in a public repository after 60 days without activity.
# Once a month this writes the date to .github/keepalive and commits it, which counts as activity.
# (netlify.toml skips the website deploy for changes under .github/.)
name: Keep schedules alive
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep scheduled workflows active" || exit 0
          git push
