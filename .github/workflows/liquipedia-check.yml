name: Liquipedia check
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Optional: one query to print, e.g. squadplayer?limit=3'
        required: false
      rows:
        description: Rows to print
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx -y tsx@4.19.2 scripts/liquipedia-check.ts
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LP_QUERY: ${{ inputs.query }}
          LP_ROWS: ${{ inputs.rows }}
