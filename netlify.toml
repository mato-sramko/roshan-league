[build]
  command = "npm run build"
  publish = ".next"
  # Every production deploy costs credits: skip it when nothing the website uses has changed
  # (exit code 0 = skip). Changes to scripts/, .github/ or README.md never redeploy the site.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app lib public season.config.ts package.json package-lock.json next.config.mjs netlify.toml tsconfig.json"

[build.environment]
  NODE_VERSION = "22"
